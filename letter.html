<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファンレター | すりぃーぴぃー</title>

  <style>
    @font-face {
  font-family: "Uzura";
  src: url("./uzura.ttf") format("truetype");
  font-weight: normal;
}
    body {
      margin: 0;
      background: #f7fcfe;
      color: #66828c;
      font-family: "Uzura", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px 20px;
      background: #ffffff;
    }

    h1 {
      text-align: center;
      color: #72c3d4;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      color: #a4c8d0;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #6fa9b5;
      font-size: 16px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2f3f7;
      border-radius: 16px;
      background: #fbfeff;
      color: #66828c;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #a9dfea;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 20px;
      background: #a9dfea;
      color: white;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #91d2df;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #8bb7c0;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #eefafd;
      color: #68aebb;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>💌 ファンレター</h1>

    <div class="sub">
      すりぃーぴぃーにお手紙を届けよう 🐾
    </div>

    <label for="name">ニックネーム</label>
    <input
      id="name"
      type="text"
      placeholder="お名前を入力してね"
      maxlength="30"
    >

    <label for="letter">ファンレター</label>
    <textarea
      id="letter"
      placeholder="すりぃーぴぃーへのお手紙を書いてね……💤"
      maxlength="2000"
    ></textarea>

    <button onclick="sendLetter()">
      💌 すりぃーぴぃーに届ける
    </button>

    <div id="message" class="message">
      お手紙を書いてくれてありがとう♡
    </div>

    <a class="back" href="index.html">
      ← ホームに戻る
    </a>

  </main>

  <script>
    function sendLetter() {
      const name = document.getElementById("name").value.trim();
      const letter = document.getElementById("letter").value.trim();
      const message = document.getElementById("message");

      if (!name || !letter) {
        alert("ニックネームとファンレターを入力してね🐾");
        return;
      }

      message.style.display = "block";

      document.getElementById("name").value = "";
      document.getElementById("letter").value = "";
    }
  </script>

</body>
</html>
